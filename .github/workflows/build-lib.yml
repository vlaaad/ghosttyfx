name: Build ghosttyfx

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dotcmd
            ~/Library/Caches/dotcmd
            ~/AppData/Local/dotcmd/Cache
            ~/.m2/repository
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cmd', '.cmd.lua', '**/pom.xml') }}

      - name: Test
        run: ./.cmd test -B

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-linux-x86_64
          path: ghosttyfx-linux-x86_64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dotcmd
            ~/Library/Caches/dotcmd
            ~/AppData/Local/dotcmd/Cache
            ~/.m2/repository
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cmd', '.cmd.lua', '**/pom.xml') }}

      - name: Test
        run: ./.cmd test -B

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-linux-aarch64
          path: ghosttyfx-linux-aarch64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dotcmd
            ~/Library/Caches/dotcmd
            ~/AppData/Local/dotcmd/Cache
            ~/.m2/repository
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cmd', '.cmd.lua', '**/pom.xml') }}

      - name: Test
        run: ./.cmd test -B

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-macos-aarch64
          path: ghosttyfx-macos-aarch64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dotcmd
            ~/Library/Caches/dotcmd
            ~/AppData/Local/dotcmd/Cache
            ~/.m2/repository
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cmd', '.cmd.lua', '**/pom.xml') }}

      - name: Test
        run: ./.cmd test -B -Dprism.order=sw

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-macos-x86_64
          path: ghosttyfx-macos-x86_64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dotcmd
            ~/Library/Caches/dotcmd
            ~/AppData/Local/dotcmd/Cache
            ~/.m2/repository
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cmd', '.cmd.lua', '**/pom.xml') }}

      - name: Test
        run: ./.cmd test -B

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-windows-x86_64
          path: ghosttyfx-windows-x86_64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    env:
      GHOSTTYFX_PLATFORM_IDS: >-
        linux-x86_64
        linux-aarch64
        macos-aarch64
        macos-x86_64
        windows-x86_64
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-aarch64
      - macos-x86_64
      - windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: release-artifacts

      - name: Stage cross-platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          ghostty_commit="$(git -C ghostty rev-parse HEAD)"
          dist_dir="dist/${ghostty_commit}"
          mkdir -p "${dist_dir}"

          read -ra platform_ids <<< "${GHOSTTYFX_PLATFORM_IDS}"
          for platform_id in "${platform_ids[@]}"
          do
            artifact_id="ghosttyfx-${platform_id}"
            source_dir="release-artifacts/${artifact_id}"
            target_dir="${dist_dir}/${artifact_id}"
            test -d "${source_dir}"
            rm -rf "${target_dir}"
            mkdir -p "${target_dir}"
            cp -R "${source_dir}/." "${target_dir}/"
          done

      - name: Compute release version
        shell: bash
        run: |
          set -euo pipefail
          release_projects=":ghosttyfx-parent,:ghosttyfx-core,:ghosttyfx"
          read -ra platform_ids <<< "${GHOSTTYFX_PLATFORM_IDS}"
          for platform_id in "${platform_ids[@]}"
          do
            release_projects="${release_projects},:ghosttyfx-${platform_id}"
          done
          echo "GHOSTTYFX_VERSION=0.1.$(git rev-list --count HEAD)" >> "${GITHUB_ENV}"
          echo "GHOSTTYFX_RELEASE_PROJECTS=${release_projects}" >> "${GITHUB_ENV}"

      - name: Configure publishing credentials
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Verify shared binding bytecode
        shell: bash
        run: |
          set -euo pipefail
          ./.cmd mvn -B -Prelease -DskipTests \
            -pl "${GHOSTTYFX_RELEASE_PROJECTS}" \
            "-Drevision=${GHOSTTYFX_VERSION}" \
            package

          mkdir -p target/ci

          core_jar="ghosttyfx-core/target/ghosttyfx-core-${GHOSTTYFX_VERSION}.jar"
          ./.cmd jar tf "${core_jar}" > target/ci/ghosttyfx-core.entries
          grep -q '^io/github/vlaaad/ghosttyfx/TerminalView.class$' target/ci/ghosttyfx-core.entries
          if grep -Eq '^(io/github/vlaaad/ghostty/bindings/|native/)' target/ci/ghosttyfx-core.entries
          then
            echo "::error::ghosttyfx-core must not contain generated bindings or native libraries"
            exit 1
          fi

          read -ra platform_ids <<< "${GHOSTTYFX_PLATFORM_IDS}"
          for platform_id in "${platform_ids[@]}"
          do
            platform_jar="ghosttyfx-${platform_id}/target/ghosttyfx-${platform_id}-${GHOSTTYFX_VERSION}.jar"
            platform_entries="target/ci/ghosttyfx-${platform_id}.entries"
            ./.cmd jar tf "${platform_jar}" > "${platform_entries}"
            grep -q '^io/github/vlaaad/ghostty/bindings/ghostty_vt_h.class$' "${platform_entries}"
            grep -q "^native/${platform_id}.zip$" "${platform_entries}"
            if grep -q '^io/github/vlaaad/ghosttyfx/TerminalView.class$' "${platform_entries}"
            then
              echo "::error::ghosttyfx-${platform_id} must obtain shared classes from ghosttyfx-core"
              exit 1
            fi
          done

          ./.cmd javap \
            -classpath "ghosttyfx-core/target/classes:ghosttyfx-linux-x86_64/target/classes" \
            -v io.github.vlaaad.ghosttyfx.TerminalSession \
            > target/ci/TerminalSession.javap

          if grep -E 'REF_invokeStatic io/github/vlaaad/ghostty/bindings/ghostty_vt_h\.ghostty_' target/ci/TerminalSession.javap
          then
            echo "::error file=ghosttyfx-core/src/main/java/io/github/vlaaad/ghosttyfx/TerminalSession.java::Shared ghosttyfx bytecode must not capture generated binding methods in lambda bootstrap targets. Use explicit wrapper methods or anonymous classes around jextract calls."
            exit 1
          fi

      - name: Publish to Central Portal
        run: >
          ./.cmd mvn -B -Prelease
          -pl "${GHOSTTYFX_RELEASE_PROJECTS}"
          "-Drevision=${GHOSTTYFX_VERSION}"
          deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
