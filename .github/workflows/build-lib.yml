name: Build ghosttyfx

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/GhosttyBuild.java') }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: xvfb-run -a mvn -B "-Dghosttyfx.native.mode=build" clean test

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-linux-x86_64
          path: ghosttyfx-linux-x86_64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/GhosttyBuild.java') }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: xvfb-run -a mvn -B "-Dghosttyfx.native.mode=build" clean test

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-linux-aarch64
          path: ghosttyfx-linux-aarch64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/GhosttyBuild.java') }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B "-Dghosttyfx.native.mode=build" clean test

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-macos-aarch64
          path: ghosttyfx-macos-aarch64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/GhosttyBuild.java') }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B "-Dghosttyfx.native.mode=build" -Dprism.order=sw clean test

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-macos-x86_64
          path: ghosttyfx-macos-x86_64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/GhosttyBuild.java') }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B "-Dghosttyfx.native.mode=build" clean test

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: ghosttyfx-windows-x86_64
          path: ghosttyfx-windows-x86_64/target/ghosttyfx-artifact/
          retention-days: ${{ github.ref == 'refs/heads/main' && 60 || 1 }}
          compression-level: 0

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-aarch64
      - macos-x86_64
      - windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: release-artifacts

      - name: Stage cross-platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          ghostty_commit="$(git -C ghostty rev-parse HEAD)"
          dist_dir="dist/${ghostty_commit}"
          mkdir -p "${dist_dir}"

          for artifact_id in \
            ghosttyfx-linux-x86_64 \
            ghosttyfx-linux-aarch64 \
            ghosttyfx-macos-aarch64 \
            ghosttyfx-macos-x86_64 \
            ghosttyfx-windows-x86_64
          do
            source_dir="release-artifacts/${artifact_id}"
            target_dir="${dist_dir}/${artifact_id}"
            test -d "${source_dir}"
            rm -rf "${target_dir}"
            mkdir -p "${target_dir}"
            cp -R "${source_dir}/." "${target_dir}/"
          done

      - name: Compute release version
        shell: bash
        run: |
          set -euo pipefail
          echo "GHOSTTYFX_VERSION=0.1.$(git rev-list --count HEAD)" >> "${GITHUB_ENV}"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify shared binding bytecode
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a mvn -B -Prelease -DskipTests \
            -pl :ghosttyfx-parent,:ghosttyfx,:ghosttyfx-linux-x86_64,:ghosttyfx-linux-aarch64,:ghosttyfx-macos-aarch64,:ghosttyfx-macos-x86_64,:ghosttyfx-windows-x86_64 \
            "-Drevision=${GHOSTTYFX_VERSION}" \
            package

          mkdir -p target/ci
          javap \
            -classpath "ghosttyfx/target/classes:ghosttyfx-linux-x86_64/target/classes" \
            -v io.github.vlaaad.ghosttyfx.TerminalSession \
            > target/ci/TerminalSession.javap

          if grep -E 'REF_invokeStatic io/github/vlaaad/ghostty/bindings/ghostty_vt_h\.ghostty_' target/ci/TerminalSession.javap
          then
            echo "::error file=ghosttyfx/src/main/java/io/github/vlaaad/ghosttyfx/TerminalSession.java::Shared ghosttyfx bytecode must not capture generated binding methods in lambda bootstrap targets. Use explicit wrapper methods or anonymous classes around jextract calls."
            exit 1
          fi

      - name: Publish to Central Portal
        run: >
          xvfb-run -a mvn -B -Prelease
          -pl :ghosttyfx-parent,:ghosttyfx,:ghosttyfx-linux-x86_64,:ghosttyfx-linux-aarch64,:ghosttyfx-macos-aarch64,:ghosttyfx-macos-x86_64,:ghosttyfx-windows-x86_64
          "-Drevision=${GHOSTTYFX_VERSION}"
          deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
